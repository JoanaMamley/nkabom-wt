<app-auth-layout tagline="Create your account">
  <div class="greeting">
    <p class="hello">Welcome!</p>
    <p class="time">Join the alumnae community</p>
  </div>

  <h1><span class="accent">Sign up</span> for your account</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder=" "
        [attr.aria-invalid]="invalid('email')"
        [attr.aria-describedby]="invalid('email') ? 'email-error' : null"
      />
      <label for="email">Email address</label>
      @if (invalid('email')) {
        <p id="email-error" class="field-error">Enter a valid email address.</p>
      }
    </div>

    <div class="field has-reveal">
      <input
        #passwordInput
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        placeholder=" "
        [attr.aria-invalid]="invalid('password')"
        aria-describedby="password-hint"
      />
      <label for="password">Password</label>
      <app-reveal-password [input]="passwordInput" />
      <p id="password-hint" class="hint" [class.field-error]="invalid('password')">
        At least {{ minPasswordLength }} characters.
      </p>
    </div>

    @if (error(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="primary" [disabled]="busy()">
      {{ busy() ? 'Signing up…' : 'Sign up' }}
    </button>
  </form>

  <app-privacy-summary />

  <p class="switch">Already have an account? <a routerLink="/login">Log in</a></p>
</app-auth-layout>
