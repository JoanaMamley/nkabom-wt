<button
  type="button"
  [attr.aria-label]="shown() ? 'Hide password' : 'Show password'"
  [attr.aria-pressed]="shown()"
  [title]="shown() ? 'Hide password' : 'Show password'"
  (click)="toggle()"
>
  @if (shown()) {
    <!-- Eye crossed out: hides the password -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 3l18 18" />
      <path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3 3.9" />
      <path d="M6.6 6.6C3.9 8.3 2.5 12 2.5 12S6 19 12 19a9.7 9.7 0 0 0 5.4-1.6" />
      <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
    </svg>
  } @else {
    <!-- Eye: shows the password -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z" />
      <circle cx="12" cy="12" r="3" />
    </svg>
  }
</button>
