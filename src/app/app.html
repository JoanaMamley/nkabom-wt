<!-- Full-screen pages carry their own toggle and privacy link (AuthLayout). Offline, the header
     comes back, so the toggle is still on screen. -->
@if (!fullScreen() || !online()) {
  <header class="app-header">
    <span class="brand">Nkabom</span>
    <app-theme-toggle />
  </header>
}

@if (!online()) {
  <app-offline-page />
}

<!-- Hidden rather than removed while offline, so a half-filled form survives a dropped connection. -->
<div [hidden]="!online()">
  <main [class.full-screen]="fullScreen()">
    <router-outlet />
  </main>

  @if (!fullScreen()) {
    <footer class="app-footer">
      <a routerLink="/privacy">Privacy notice</a>
    </footer>
  }
</div>

@if (updates.ready()) {
  <div class="update" role="status">
    <span>A new version of Nkabom is ready.</span>
    <button type="button" (click)="updates.reload()">Reload</button>
  </div>
}
