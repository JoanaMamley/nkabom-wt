<header class="app-header">
  <span class="brand">Nkabom</span>
  <app-theme-toggle />
</header>

@if (!online()) {
  <app-offline-page />
}

<!-- Hidden rather than removed while offline, so a half-filled form survives a dropped connection. -->
<div [hidden]="!online()">
  <main>
    <h1>Nkabom</h1>
    <p>The WomenTrust alumnae community.</p>
  </main>

  <router-outlet />
</div>

@if (updates.ready()) {
  <div class="update" role="status">
    <span>A new version of Nkabom is ready.</span>
    <button type="button" (click)="updates.reload()">Reload</button>
  </div>
}
