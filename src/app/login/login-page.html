<app-auth-layout tagline="Log in to your account">
  <div class="greeting">
    <p class="hello">Hello!</p>
    <p class="time">{{ greeting }}</p>
  </div>

  <h1><span class="accent">Log in</span> to your account</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder=" "
        [attr.aria-invalid]="invalid('email')"
        [attr.aria-describedby]="invalid('email') ? 'email-error' : null"
      />
      <label for="email">Email address</label>
      @if (invalid('email')) {
        <p id="email-error" class="field-error">Enter a valid email address.</p>
      }
    </div>

    <div class="field">
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder=" "
        [attr.aria-invalid]="invalid('password')"
        [attr.aria-describedby]="invalid('password') ? 'password-error' : null"
      />
      <label for="password">Password</label>
      @if (invalid('password')) {
        <p id="password-error" class="field-error">Enter your password.</p>
      }
    </div>

    <div class="options">
      <label class="remember">
        <input type="checkbox" formControlName="remember" />
        Remember me
      </label>
      <!-- Password reset arrives with NKB-203. -->
      <span class="soon" aria-disabled="true"> Forgot password? <small>(coming soon)</small> </span>
    </div>

    @if (error(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="primary" [disabled]="busy()">
      {{ busy() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>

  <p class="switch"><a routerLink="/sign-up">Create an account</a></p>
</app-auth-layout>
