<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nkabom</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="The WomenTrust alumnae community" />
    <meta name="theme-color" content="#e95300" />
    <script>
      // Apply a saved light or dark choice before first paint, so there is no flash of the other
      // mode (NKB-108). Without one, styles.scss follows the device setting.
      try {
        var theme = localStorage.getItem('nkabom-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iPhone: Add to Home Screen uses these, not the manifest icons. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Nkabom" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Nkabom needs JavaScript. Turn it on in your browser settings and reload.</noscript>
  </body>
</html>
