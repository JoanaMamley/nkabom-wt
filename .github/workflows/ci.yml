name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A release: v1.0.0 and so on, tagged on main, deploys to production after approval.
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Node 24 matches local development, and the Firebase SDK 13 packages require 24.12+.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng lint
      - run: npx prettier --check .
      - run: npm run check:contrast
      - run: npm test -- --watch=false
      - run: npm run build

  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # A dry run: bundles the Worker and checks wrangler.jsonc without deploying.
      - run: npm run build

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  # The one check to require on pull requests. It runs even when a job above fails, because a
  # skipped required check counts as passing. New jobs only need adding to `needs` and the test.
  ci:
    name: CI
    if: always()
    needs: [frontend, worker, rules]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        run: >-
          [ "${{ needs.frontend.result }}" = success ]
          && [ "${{ needs.worker.result }}" = success ]
          && [ "${{ needs.rules.result }}" = success ]

  # Deploys (NKB-121), each only once the CI check above has passed. See deploy.yml.
  staging:
    name: Deploy staging
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit

  production:
    name: Deploy production
    needs: ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit

  # Pull requests from forks get no secrets, so only this repository's own branches get a preview.
  preview:
    name: Deploy preview
    needs: ci
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      pull-request: ${{ github.event.pull_request.number }}
    secrets: inherit
